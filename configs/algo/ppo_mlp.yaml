algo_name: "ppo"

policy: "MlpPolicy"
device: "auto"
seed: 0
progress_bar: true
deterministic_eval: true

total_timesteps: 500000
learning_rate: 3.0e-4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
normalize_advantage: true
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
intrinsic_update_freq: 2048

policy_kwargs:
  net_arch:
    pi: [128, 128]
    vf: [128, 128]

eval:
  eval_freq: 5000
  n_eval_episodes: 50

checkpoint:
  checkpoint_freq: 5000

logging:
  log_interval: 10
