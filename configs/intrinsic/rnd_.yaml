name: "rnd"
coef: 0.01

learning_rate: 1.0e-4
activation: "relu"
device: "auto"
seed: 0

# Shared CNN trunk for target/predictor
conv_layers:
  - out_channels: 32
    kernel_size: 5
    stride: 2
    padding: 2
  - out_channels: 32
    kernel_size: 3
    stride: 2
    padding: 2
  - out_channels: 64
    kernel_size: 3
    stride: 1
    padding: 1

# Different fully-connected heads after the shared CNN trunk
# Both last dimensions must match.
target_linear_layers: [256]
predictor_linear_layers: [256, 256, 256]

# Internal predictor training schedule
buffer_capacity: 100000
batch_size: 64
min_buffer_size: 512
update_every: 4
updates_per_step: 1

# Reward normalization
normalize_reward: true
reward_norm_mode: "discounted"   # one of: none, discounted, batch
reward_norm_gamma: 0.99
reward_norm_epsilon: 1.0e-8
intrinsic_clip: null
