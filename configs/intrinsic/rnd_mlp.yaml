name: "rnd"

initial_coef: 0.1
final_coef: 0.01
coef_decay_fraction: 1.0

normalize_reward: true
reward_gamma: 0.99
reward_norm_eps: 1.0e-8
intrinsic_clip: 5.0

learning_rate: 1.0e-4
encoder_type: "mlp"
activation: "relu"
embedding_dim: 64

device: "auto"
seed: 0

target_hidden_layers: [256]
predictor_hidden_layers: [256, 256, 256]